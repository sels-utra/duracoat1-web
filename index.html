<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duracoat Paints</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="menu-button-wrap">
            <button id="menuBtn" class="menu-icon" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div id="menuPanel" class="menu-panel">
                <a href="about.html">About Us</a>
                <a href="terms.html">Terms & Conditions</a>
                <a href="privacy.html">Privacy Policy</a>
            </div>
        </div>

        <!-- Logo -->
        <div class="brand">
            <strong>DURACOAT 1</strong> Paints
        </div>

        <!-- Search bar -->
        <input type="text" placeholder="Search paints...">
    </header>

    <!-- Main content -->
    <h1>Welcome to Duracoat Paints</h1>
    <p>This is the home page of our sales website.</p>

    <!-- BOTTOM NAVIGATION -->
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="store.html">Store</a>
        <a href="message.html">Message</a>
        <a href="cart.html">Cart</a>
    </nav>
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const menuPanel = document.getElementById('menuPanel');

        if (menuBtn && menuPanel) {
            menuBtn.addEventListener('click', function () {
                menuPanel.classList.toggle('show');
            });

            document.addEventListener('click', function (event) {
                if (!event.target.closest('.menu-button-wrap')) {
                    menuPanel.classList.remove('show');
                }
            });
        }
    </script>
</body>
</html
